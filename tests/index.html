<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascent tool tests</title>
    <meta name="theme-color" content="#0b0f14" />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      body { max-width: 780px; }
      a { color: var(--accent); }
      #summary { color: var(--text-muted); font-weight: 600; }
      #summary.pass { color: var(--success); }
      #summary.fail { color: var(--danger); }
      #results {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.85rem 1rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 0.85rem/1.6 ui-monospace, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <p><a href="../">← Ascent Web Tool</a></p>
    <h1>Browser tests</h1>
    <p class="hint">Runs against a simulated device. No hardware needed.</p>
    <p id="summary" role="status">Running…</p>
    <pre id="results"></pre>
    <script>
      if (location.protocol === "file:") {
        const summary = document.getElementById("summary");
        summary.textContent = "Open this page through a local HTTP server to run the tests.";
        summary.classList.add("fail");
        document.getElementById("results").textContent =
          "From the AscentWebTool folder, run: python -m http.server 5173\n" +
          "Then open: http://localhost:5173/tests/";
      }
    </script>

    <!--
      The original bundle initializes its UI at load time. These hidden
      elements let it run as a reference implementation for the parity tests.
    -->
    <div hidden>
      <div id="unsupported-banner"></div>
      <button id="btn-connect" type="button"></button>
      <p id="device-info"></p>
      <p id="firmware-hint"></p>
      <input id="file-input" type="file" />
      <button id="btn-upgrade" type="button"></button>
      <div id="progress-bar"></div>
      <p id="status-text"></p>
      <pre id="log"></pre>
    </div>

    <script src="../reference/original.min.js"></script>
    <script type="module" src="./tests.js"></script>
  </body>
</html>
