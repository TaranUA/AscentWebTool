<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascent tool tests</title>
    <style>
      body { color: #222; max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }
      #summary { font-weight: 600; }
      #results { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
      .pass { color: #2e7d32; }
      .fail { color: #c62828; }
    </style>
  </head>
  <body>
    <h1>Ascent tool tests</h1>
    <p id="summary">Running…</p>
    <pre id="results"></pre>

    <!--
      The original bundle initializes its UI at load time. These hidden
      elements let it run as a reference implementation for the parity tests.
    -->
    <div hidden>
      <div id="unsupported-banner"></div>
      <button id="btn-connect" type="button"></button>
      <p id="device-info"></p>
      <p id="firmware-hint"></p>
      <input id="file-input" type="file" />
      <button id="btn-upgrade" type="button"></button>
      <div id="progress-bar"></div>
      <p id="status-text"></p>
      <pre id="log"></pre>
    </div>

    <script src="../reference/original.min.js"></script>
    <script type="module" src="./tests.js"></script>
  </body>
</html>
